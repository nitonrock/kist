# Kist on Bitbucket Pipelines: pull-request leak guard + lock every profile into PostgreSQL.
#
# Repository variables (Repository settings > Repository variables), all "Secured":
#   KIST_DATABASE_URL, KIST_PASSWORD_<PROFILE> (one per profile this pipeline may lock)
# Repository variables reach every step automatically.
image: python:3.13-slim

definitions:
  steps:
    - step: &leak-guard
        name: Kist leak guard
        script:
          - apt-get update -qq && apt-get install -y -qq --no-install-recommends git >/dev/null
          - pip install --quiet --root-user-action=ignore "kist==0.2.7"
          # Must match what developers use when they commit:
          - export KIST_ORG_ID=local KIST_PROJECT_ID=default
          - kist pre-commit-guard --all-files

pipelines:
  pull-requests:
    '**':
      - step: *leak-guard

  branches:
    main:
      - step: *leak-guard
      - step:
          name: Lock secrets into PostgreSQL
          deployment: production
          script:
            - apt-get update -qq && apt-get install -y -qq --no-install-recommends git >/dev/null
            - pip install --quiet --root-user-action=ignore "kist==0.2.7"
            - export KIST_ENV=production KIST_TLS_MODE=require KIST_ORG_ID=local KIST_PROJECT_ID=default
            - kist lock --all            # --prune deletes keys removed from YAML
      - step:
          name: Deploy
          script:
            - echo "Deploy your application here. DynamicSecretStore reloads via PostgreSQL NOTIFY."
