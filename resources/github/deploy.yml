name: Deploy & Sync Secrets to PostgreSQL

on:
  push:
    branches:
      - main
    paths:
      - 'secrets*.yaml'
      - 'secrets*.yml'
      - 'secrets/**'
      - 'src/**'

jobs:
  sync-secrets-and-deploy:
    name: Sync Secrets & Deploy Application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python & uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          python-version: "3.13"

      - name: Install Project & Kist
        run: |
          uv sync || pip install kist

      - name: Sync Secrets to Production Database
        env:
          KIST_DATABASE_URL: ${{ secrets.KIST_DATABASE_URL }}
          KIST_PASSWORD_PRODUCTION: ${{ secrets.KIST_PASSWORD_PRODUCTION }}
        run: |
          echo "🔒 Locking and flattening secrets into PostgreSQL..."
          uv run kist --profile production lock secrets/production.yaml
          echo "✅ Secrets successfully synced to PostgreSQL (LISTEN/NOTIFY signals emitted)."

      - name: Deploy Application Container
        run: |
          echo "🚀 Deploying application..."
          # Application nodes using DynamicSecretStore or AsyncDynamicSecretStore
          # automatically receive instant cache invalidation via PostgreSQL NOTIFY.
