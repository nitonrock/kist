# Lock every Kist profile into PostgreSQL after a merge, then deploy.
#
# Repository secrets (Settings > Secrets and variables > Actions), e.g. with gh:
#   gh secret set KIST_DATABASE_URL
#   gh secret set KIST_PASSWORD_PRODUCTION < ~/.kist/pwd_production
# GitHub only passes secrets that are listed under env: below, one line per profile.
name: Kist sync and deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  KIST_ENV: production
  KIST_TLS_MODE: require
  # Must match what developers use when they commit:
  KIST_ORG_ID: local
  KIST_PROJECT_ID: default
  # KIST_REPOSITORY_ID: local-repository

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install --quiet "kist==0.2.9"

      - name: Lock secrets into PostgreSQL
        env:
          KIST_DATABASE_URL: ${{ secrets.KIST_DATABASE_URL }}
          KIST_PASSWORD_PRODUCTION: ${{ secrets.KIST_PASSWORD_PRODUCTION }}
          KIST_PASSWORD_PAYMENTS: ${{ secrets.KIST_PASSWORD_PAYMENTS }}
          # One line per profile; profiles without a secret are skipped.
        run: kist lock --all            # --prune deletes keys removed from YAML

      - name: Deploy
        run: echo "Deploy your application here. DynamicSecretStore reloads via PostgreSQL NOTIFY."
