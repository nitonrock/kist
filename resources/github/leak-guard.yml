# Kist leak guard for pull requests: blocks plaintext secret files, likely
# credentials and envelopes moved without re-encryption. Needs no secrets.
name: Kist leak guard

on:
  pull_request:

permissions:
  contents: read

env:
  # Must match what developers use when they commit:
  KIST_ORG_ID: local
  KIST_PROJECT_ID: default
  # KIST_REPOSITORY_ID: local-repository

jobs:
  leak-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install --quiet "kist==0.2.5"
      - run: kist pre-commit-guard --all-files
