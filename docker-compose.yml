# Throwaway local PostgreSQL for trying Kist. Not for production.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: kist
      POSTGRES_PASSWORD: kist
      POSTGRES_DB: kist
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kist"]
      interval: 2s
      retries: 15
