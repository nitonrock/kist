[project]
name = "kist"
version = "0.2.9"
description = "A Self-Sufficient Multi-Profile Secrets Manager and Git Leak Guard"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "nitonrock", email = "info@nitonrock.com"}
]


classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security :: Cryptography",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]

keywords = [
    "secrets",
    "security",
    "git",
    "postgresql",
    "encryption",
    "fastapi",
    "git-leak-guard",
]

dependencies = [
    "cryptography>=50.0.0",
    "psycopg[binary]>=3.3.4",
    "pyyaml>=6.0.3",
]

[project.scripts]
kist = "kist:main"

[build-system]
requires = ["uv-build>=0.9.18, <0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "kist"
module-root = ""

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff==0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Correctness (F, E, B), imports (I), modern syntax (UP) and security (S, Bandit rules).
select = ["E4", "E7", "E9", "F", "B", "I", "UP", "S"]
ignore = [
    "S603",  # subprocess without shell: Kist runs git with argument lists, never a shell
    "S607",  # partial executable path: "git" is resolved from PATH on purpose
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["kist.core.Argon2Policy"]  # frozen dataclass

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B017"]  # tests use assert, fixed test passwords and subprocess freely
