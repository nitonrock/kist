[project]
name = "kist"
version = "0.1.2"
description = "A Self-Sufficient Multi-Profile Secrets Manager and Git Leak Guard"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENCE", "NOTICE"]
authors = [
    { name = "nitonrock", email = "info@nitonrock.com"}
]


classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security :: Cryptography",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]

keywords = [
    "secrets",
    "security",
    "git",
    "postgresql",
    "encryption",
    "fastapi",
    "git-leak-guard",
]

dependencies = [
    "cryptography>=50.0.0",
    "psycopg[binary]>=3.3.4",
    "pyyaml>=6.0.3",
]

[project.scripts]
kist = "kist:main"

[build-system]
requires = ["uv-build>=0.9.18, <0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "kist"
module-root = ""

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
