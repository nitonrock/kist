name: Security & Leak Guard

on:
  pull_request:
    branches:
      - main

jobs:
  check-leaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python & uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.13"

      - name: Install Kist
        run: uv sync

      - name: Run Kist Leak Guard
        run: |
          # Verify committed secret files are encrypted with Fernet (starts with gAAAAA)
          for file in $(find . -maxdepth 2 -name "secrets*.yaml" -o -name "secrets*.yml"); do
            if [ -s "$file" ]; then
              first_chars=$(head -c 6 "$file")
              if [ "$first_chars" != "gAAAAA" ]; then
                echo "🚨 CRITICAL: $file is not encrypted! Plaintext commit detected."
                exit 1
              fi
            fi
          done
          echo "✅ All secret YAML files are properly encrypted."
