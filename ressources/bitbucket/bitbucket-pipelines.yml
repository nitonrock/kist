image: python:3.13-slim

definitions:
  steps:
    - step: &leak-guard
        name: Scan for Plaintext Secrets & Verify Envelopes
        script:
          - pip install uv
          - uv sync || pip install kist
          - echo "🔍 Verifying all secret YAML files are valid Kist encrypted envelopes..."
          - |
            python - << 'EOF'
            import sys
            from pathlib import Path
            from kist.core import is_kist_envelope

            secret_files = list(Path('.').glob('secrets*.yaml')) + \
                           list(Path('.').glob('secrets*.yml')) + \
                           list(Path('secrets').glob('*.yaml') if Path('secrets').is_dir() else []) + \
                           list(Path('secrets').glob('*.yml') if Path('secrets').is_dir() else [])

            failed = False
            checked = 0
            for file_path in set(secret_files):
                if file_path.is_file() and file_path.stat().st_size > 0:
                    checked += 1
                    content = file_path.read_bytes()
                    if not is_kist_envelope(content):
                        print(f"🚨 CRITICAL: {file_path} is NOT an encrypted Kist envelope! Plaintext commit detected.", file=sys.stderr)
                        failed = True
                    else:
                        print(f"🔒 OK: {file_path} verified as valid Kist encrypted envelope.")

            if failed:
                print("\n❌ Pipeline check failed: Unencrypted secret files detected.", file=sys.stderr)
                sys.exit(1)

            print(f"\n✅ All {checked} secret file(s) successfully verified.")
            EOF

pipelines:
  # Run leak guard on all Pull Requests
  pull-requests:
    '**':
      - step: *leak-guard

  # Main branch pipeline: Sync secrets & deploy
  branches:
    main:
      - step: *leak-guard
      - step:
          name: Lock Secrets & Sync PostgreSQL
          caches:
            - pip
          script:
            - pip install uv
            - uv sync || pip install kist
            - export KIST_DATABASE_URL=$KIST_DATABASE_URL
            - export KIST_PASSWORD_PRODUCTION=$KIST_PASSWORD_PRODUCTION
            - echo "🔒 Updating secrets in centralized database..."
            - uv run kist --profile production lock secrets/production.yaml
            - echo "✅ Database updated with encrypted secret state."
      - step:
          name: Deploy Application
          script:
            - echo "🚀 Deploying application..."
